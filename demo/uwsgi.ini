[uwsgi]
# The Flask application
module = demo/crypto_api:app  # Replace 'app' with the name of your Flask instance (app.py)

# Bind uWSGI to a TCP socket (host:port)
http = 0.0.0.0:8080  # Replace with your desired IP and port (default is 8080)

# Enable the master process (recommended for production)
master = true

# Number of worker processes (adjust based on your server's capabilities)
processes = 4  # Number of worker processes (adjust as needed)

# Number of threads per worker process
threads = 2  # Adjust based on the load and your server's resources

# Enable the vacuum option to clean up after workers exit
vacuum = true

# Enable logging to a file for easier debugging
logto = uwsgi.log  # Replace with the path where you want logs to be stored

# Set the file permissions for the log file (if needed)
chmod-socket = 660

# Enable the use of Unix socket (alternative to TCP socket)
#socket = /tmp/uwsgi.sock  # Uncomment to use Unix socket instead of TCP

# Set the Python path (if you're using a virtualenv or specific Python version)
; virtualenv = /path/to/your/virtualenv  # Only necessary if using a virtualenv

# Other useful settings
max-requests = 5000